; Knuckles' Chaotix Recompiled - achievement definitions
;
; Original definitions for this project (nothing is fetched from, or sent to,
; any service). Every address was found by watching 68K work RAM while the
; game runs; see docs/ACHIEVEMENTS.md for how, and for the condition language.
;
; Titles are written in capitals and use only letters, digits, spaces and
; ! ? - , . ' so that the game's own letters can draw them.
;
; An `id` is the key a player's save file keeps: never change one, even when
; the title or the condition changes. New achievements get new ids.

[vars]
mode  = word FFDFDE
; The place being played: 0 BOTANIC BASE, 1 SPEED SLIDER, 2 AMAZING ARENA,
; 3 TECHNO TOWER, 4 MARINA MADNESS, 5 TRAINING, 6 INTRODUCTION (Isolated
; Island), 7 WORLD ENTRANCE (the lobby, and the final battle and ending).
zone  = word FFDFF2
; The level of that place (1-5 in an attraction; 0 the lobby or a scene).
level = word FFDFF4
; The ring count, reset to 0 when a level starts.
rings = word FFE008
; The two characters, as the index into the game's own name table times four
; (0 MIGHTY, 8 KNUCKLES, 12 CHARMY BEE, 16 VECTOR, 20 BOMB, 24 HEAVY,
; 28 ESPIO; 4 is a hole in that table). See runtime/stage_select.h.
player = word FFE038
combi  = word FFE03A
; 0x10 while a second player has the partner, 0xFE while one player has both.
pad2   = byte FFE05C
; Not the level clock: FFE052 goes back to zero whenever the player presses
; anything, so it is frames since they last did.
idle   = word FFE052
; The level clock as the HUD shows it, in 1/64 s: the high four bits are
; minutes, the low twelve the ticks within the minute (0x0B40 is 0'45"). It
; reads 0 until the player has control and in the lobby, and stops at the
; goal: the recorded run in tests/recordings stops it at 0x08A8, the 0'34"6x
; on its results screen.
clock  = word FFE010
; 0xFF from the frame a level's goal is passed until the next scene; 0 before.
; Set by the goal ($890882), seen at frame 3423 of the recorded run.
goal   = byte FFFDC5
; Time of day: 0-1 MORNING, 2-3 DAY, 4-5 SUNSET, 6-7 NIGHT (bit 0 is the half
; step each finished level adds). See docs/LOBBY_SHORTCUTS.md.
tod    = word FFDFF6
; Special stages won: one more each time one is cleared ($927A16), which is
; what gives a Chaos Ring. 6 is all six; past that it keeps counting (7-11),
; and nothing new is given but points. Seen going 0 -> 1 as a cleared special
; stage, entered from the goal of a level, hands back to the lobby.
chaos  = word FFE01A
; How far each attraction has got: the level it is up to, moved on by the end
; of every level of it ($890F86). 6 once its fifth level has been cleared.
; Marina Madness's byte is FFE002, which is also the top byte of a frame
; counter that would take years to reach it.
prog_bb = byte FFDFFE
prog_ss = byte FFDFFF
prog_aa = byte FFE000
prog_tt = byte FFE001
prog_mm = byte FFE002
; The Combi Catcher's controller object while the claw is running (an object
; address, 0x8000 and up), 0xFFFF in the lobby without one.
catcher = word FFFDD0

[rules]
; Nothing here is earned unless the player is actually playing. Modes seen,
; all checked against what is on screen:
;   0x00 boot        0x08 title screen and the game's own menus
;   0x38 the attract demo, which plays the game by itself
;   0x48 0x60 0x68   the selection screens behind Scenario Quest and Training
;   0x18 0x58        a level, the player in control
; Excluding the ones that are not play is safer than listing the ones that
; are: an unlisted play mode would silently earn nothing, while an unlisted
; non-play mode at worst lets a level's own title card count as starting it.
require = mode != 0x00 and mode != 0x08 and mode != 0x38 and mode != 0x48 and mode != 0x60 and mode != 0x68

; ---------------------------------------------------------------- rings

[achievement POCKET FULL OF GOLD]
id = rings_25
icon = ring
description = Carry 25 rings at once.
points = 5
when = rings >= 25

[achievement GIANT RING FARE]
id = rings_50
icon = ring
description = Carry 50 rings at once - enough for the giant ring at the goal.
points = 10
when = rings >= 50

[achievement RING BANK]
id = rings_100
icon = ring
description = Carry 100 rings at once.
points = 25
when = rings >= 100

; A level begins with the clock at zero; a ring lost anywhere after that
; spoils it until the next level.
[achievement TIGHT GRIP]
id = rings_no_loss
icon = ring
description = Gather 40 rings in one level without the count ever going down.
points = 20
start = clock == 0
fail = rings < prev(rings)
when = rings >= 40 and clock != 0

; ---------------------------------------------------------------- goals

[achievement THROUGH THE GOAL]
id = clear_level
icon = goal
description = Clear a level of any attraction.
points = 10
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF

[achievement BEAT THE CLOCK]
id = clear_fast
icon = clock
description = Clear a level with under 45 seconds on the clock.
points = 25
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF and clock < 0x0B40

[achievement NOT A SCRATCH]
id = clear_no_loss
icon = goal
description = Clear a level without the ring count ever going down.
points = 30
start = clock == 0
fail = rings < prev(rings)
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF

[achievement NIGHT SHIFT]
id = clear_night
icon = clock
description = Clear a level at night.
points = 10
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF and tod >= 6

[achievement EARLY BIRD]
id = clear_morning
icon = clock
description = Clear a level in the morning.
points = 10
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF and tod <= 1

; ---------------------------------------------------------------- places

; Attractions only: the lobby's scenes and the ending have levels too, and the
; bonus stage borrows WORLD ENTRANCE 3 while it loads.
[achievement HALFWAY THROUGH THE RIDE]
id = level_3
icon = place
description = Reach the third level of any attraction.
points = 10
when = zone <= 4 and level >= 3

[achievement LAST STOP]
id = level_5
icon = place
description = Reach the fifth level of any attraction.
points = 15
when = zone <= 4 and level >= 5

; ---------------------------------------------------------------- attractions
; The end of an attraction's fifth level moves its progress on to 6.

[achievement WEED KILLER]
id = done_botanic_base
icon = boss
description = Clear the fifth and last level of Botanic Base.
points = 25
when = prog_bb >= 6

[achievement END OF THE LINE]
id = done_speed_slider
icon = boss
description = Clear the fifth and last level of Speed Slider.
points = 25
when = prog_ss >= 6

[achievement STANDING OVATION]
id = done_amazing_arena
icon = boss
description = Clear the fifth and last level of Amazing Arena.
points = 25
when = prog_aa >= 6

[achievement TOP OF THE TOWER]
id = done_techno_tower
icon = boss
description = Clear the fifth and last level of Techno Tower.
points = 25
when = prog_tt >= 6

[achievement HIGH TIDE]
id = done_marina_madness
icon = boss
description = Clear the fifth and last level of Marina Madness.
points = 25
when = prog_mm >= 6

; WORLD ENTRANCE level 2 is the final battle (docs/ISSUE_56_FINAL_BOSS.md).
[achievement THE LAST ATTRACTION]
id = final_battle
icon = boss
description = Make it to the final battle.
points = 30
when = zone == 7 and level == 2

; ---------------------------------------------------------------- chaos rings

[achievement A RING OF CHAOS]
id = chaos_ring
icon = chaos
description = Win a Chaos Ring in a special stage.
points = 20
when = chaos >= 1

[achievement HALF THE SET]
id = chaos_rings_3
icon = chaos
description = Hold three Chaos Rings.
points = 25
when = chaos >= 3

[achievement EVERY COLOUR]
id = chaos_rings_6
icon = chaos
description = Hold all six Chaos Rings.
points = 50
when = chaos >= 6

; The bonus stage loads itself as WORLD ENTRANCE 3 for a moment, straight from
; the level it was entered from ($8BCD84); the ending reaches that scene only
; from the final battle, in WORLD ENTRANCE already.
[achievement INTO THE TUBE]
id = bonus_stage
icon = ring
description = Leap into a giant ring holding 20 rings or more.
points = 10
when = zone == 7 and level == 3 and prev(zone) <= 4

; ---------------------------------------------------------------- the team

[achievement BOUND TOGETHER]
id = two_players
icon = team
description = Play a level with a second player holding the other end of the ring.
points = 15
when = pad2 == 0x10

; ---------------------------------------------------------------- the whole game
; Issue #95: these take more than playing on. A set ("collect") builds up
; across sessions: the values seen at each goal, kept with the unlocks.

[achievement WORLD TOUR]
id = clear_every_attraction
icon = place
description = Clear a level of each of the five attractions.
points = 30
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF
collect = zone
count = 5

; In the game five can lead (Knuckles, Espio, Vector, Charmy, Mighty); Heavy
; and Bomb only ever come along as partners.
[achievement THE WHOLE TEAM]
id = clear_as_everyone
icon = team
description = Clear a level as each of the five who can lead the team.
points = 40
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF
collect = player
count = 5

[achievement NOBODY LEFT BEHIND]
id = clear_with_everyone
icon = team
description = Clear a level with each of the seven as your partner.
points = 30
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF
collect = combi
count = 7

[achievement SPEED DEMON]
id = clear_30s
icon = clock
description = Clear a level with under 30 seconds on the clock.
points = 40
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF and clock < 0x0780

[achievement RING HOARDER]
id = clear_100_rings
icon = ring
description = Reach a goal carrying 100 rings or more.
points = 30
when = zone <= 4 and level >= 1 and goal == 0xFF and prev(goal) != 0xFF and rings >= 100

; WORLD ENTRANCE levels 4-6 are the ending's scenes, reached only by beating
; the final battle (level 3 is also the bonus stage's, while it loads).
[achievement CURTAIN CALL]
id = ending
icon = boss
description = Beat the final battle and see the ending.
points = 50
when = zone == 7 and level >= 4
