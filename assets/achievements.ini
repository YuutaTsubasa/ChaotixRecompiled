; Knuckles' Chaotix Recompiled - achievement definitions
;
; Original definitions for this project, in the spirit of RetroAchievements
; (nothing is fetched from, or sent to, any service). The addresses were found
; by watching 68K work RAM while the game runs; see docs/ACHIEVEMENTS.md.
;
;   mode  FFDFDE  0x0008 on the title/menus, 0x0038 while an attraction runs
;   zone  FFDFF2  attraction id (7 outside a level)
;   level FFDFF4  level number shown on the title card
;   rings FFE008  ring count, reset to 0 when a level starts

[vars]
mode  = word FFDFDE
zone  = word FFDFF2
level = word FFDFF4
rings = word FFE008

[rules]
; Nothing here is earned unless the player is actually playing. Modes seen,
; all checked against what is on screen:
;   0x00 boot        0x08 title screen and the game's own menus
;   0x38 the attract demo, which plays the game by itself
;   0x48 0x60 0x68   the selection screens behind Scenario Quest and Training
;   0x18 0x58        a level, the player in control
; Excluding the ones that are not play is safer than listing the ones that
; are: an unlisted play mode would silently earn nothing, while an unlisted
; non-play mode at worst lets a level's own title card count as starting it.
require = mode != 0x00 and mode != 0x08 and mode != 0x38 and mode != 0x48 and mode != 0x60 and mode != 0x68

[achievement First Ring]
id = first_ring
description = Collect a ring.
points = 5
when = rings >= 1

[achievement Ring Collector]
id = rings_25
description = Hold 25 rings at once.
points = 10
when = rings >= 25

[achievement Ring Hoarder]
id = rings_50
description = Hold 50 rings at once.
points = 20
when = rings >= 50

[achievement Ring Machine]
id = rings_100
description = Hold 100 rings at once.
points = 40
when = rings >= 100

[achievement Keep Them Coming]
id = rings_no_loss
description = Reach 40 rings without the count ever dropping in that level.
points = 25
when = rings >= 40 and rings >= prev(rings)

[achievement Welcome to Botanic Base]
id = zone_botanic_base
description = Start a level in Botanic Base.
points = 5
when = zone == 0

[achievement Welcome to Speed Slider]
id = zone_speed_slider
description = Start a level in Speed Slider.
points = 5
when = zone == 1

[achievement Welcome to Amazing Arena]
id = zone_amazing_arena
description = Start a level in Amazing Arena.
points = 5
when = zone == 2

[achievement Welcome to Techno Tower]
id = zone_techno_tower
description = Start a level in Techno Tower.
points = 5
when = zone == 3

[achievement Welcome to Marina Madness]
id = zone_marina_madness
description = Start a level in Marina Madness.
points = 5
when = zone == 4

[achievement Isolated Island]
id = zone_isolated_island
description = Play the training attraction.
points = 5
when = zone == 6

[achievement Deeper In]
id = level_3
description = Reach level 3 of an attraction.
points = 15
when = level >= 3

[achievement The Last Level]
id = level_5
description = Reach level 5 of an attraction.
points = 30
when = level >= 5
