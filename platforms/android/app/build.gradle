// Android build: the native code is the same CMake project as desktop.
// Requirements (see platforms/android/README.md):
//   - SDL3 source checkout: -PSDL3_SOURCE_DIR=/path/to/SDL (provides SDLActivity Java sources)
//   - SDL_ttf source checkout: -PSDL3_TTF_SOURCE_DIR=/path/to/SDL_ttf (with its vendored deps)
//   - code generated on a desktop host into <repo>/generated (the recompiler is a host tool)
plugins {
    id 'com.android.application'
}

def sdl3Dir = project.findProperty('SDL3_SOURCE_DIR') ?: System.getenv('SDL3_SOURCE_DIR')
def sdl3TtfDir = project.findProperty('SDL3_TTF_SOURCE_DIR') ?: System.getenv('SDL3_TTF_SOURCE_DIR')
def repoDir = file('../../..').canonicalPath

android {
    namespace 'org.chaotixrecompiled'
    compileSdk 34
    ndkVersion project.findProperty('NDK_VERSION') ?: '29.0.13599879'

    defaultConfig {
        applicationId 'org.chaotixrecompiled'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.3.1'
        // -PABIS=arm64-v8a,x86_64 to add the emulator ABI.
        ndk { abiFilters((project.findProperty('ABIS') ?: 'arm64-v8a').split(',')) }
        externalNativeBuild {
            cmake {
                arguments "-DCHAOTIX_SDL3_SOURCE_DIR=${sdl3Dir}",
                          "-DCHAOTIX_SDL3_TTF_SOURCE_DIR=${sdl3TtfDir}",
                          "-DCHAOTIX_GENERATED_DIR=${repoDir}/generated",
                          "-DCHAOTIX_BUILD_TOOLS=OFF",
                          "-DCHAOTIX_BUILD_TESTS=OFF",
                          "-DCMAKE_BUILD_TYPE=Release"
                targets 'chaotix'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "${repoDir}/CMakeLists.txt"
            version '3.22.1+'
        }
    }
    sourceSets {
        main {
            // SDL3's Java glue (org.libsdl.app.SDLActivity etc.)
            java.srcDirs += ["${sdl3Dir}/android-project/app/src/main/java"]
        }
    }
    // A release APK is unsigned, and so uninstallable, unless you give it your
    // own keystore. Supply these on the command line or, better, in
    // platforms/android/gradle.properties, which is gitignored:
    //   -PKEYSTORE_FILE=... -PKEYSTORE_PASSWORD=... -PKEY_ALIAS=... -PKEY_PASSWORD=...
    // Keep that keystore: Android requires every later update to be signed
    // with the same key.
    signingConfigs {
        release {
            if (project.hasProperty('KEYSTORE_FILE')) {
                storeFile file(project.property('KEYSTORE_FILE'))
                storePassword project.findProperty('KEYSTORE_PASSWORD')
                keyAlias project.findProperty('KEY_ALIAS')
                keyPassword project.findProperty('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}
